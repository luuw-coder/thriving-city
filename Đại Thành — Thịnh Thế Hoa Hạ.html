<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Đại Thành — Thịnh Thế Hoa Hạ</title>
<style>
:root{--p:#eadfc4;--b:#8b5a3c;--t:#4a3322;--r:#c0392b;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);box-sizing:border-box;padding-top:var(--st);padding-bottom:var(--sb)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--p:#d3c6a6}}
:root[data-theme=dark]{--p:#d3c6a6}
html,body{height:100%;margin:0;overflow:hidden;background:#5fb3a5;font:13px/1.35 "Noto Serif","Songti SC",Georgia,serif;color:var(--t);user-select:none}
canvas#cv{position:fixed;inset:0}
.pn{position:fixed;background:var(--p);border:3px solid var(--b);border-radius:6px;box-shadow:inset 0 0 0 2px #d2b78c,0 3px 10px #0004;padding:6px 8px}
button{font:inherit;color:inherit;cursor:pointer;background:#f3e9d0;border:2px solid var(--b);border-radius:6px;padding:4px 9px}
button:hover{background:#fff4d8}button.on{background:var(--r);color:#fff;border-color:#8b2a20}
#tp{left:8px;top:calc(var(--st) + 8px);width:250px}#tt{font-size:15px;color:var(--r)}
#spd{display:flex;gap:4px;margin-top:4px}#spd button{padding:2px 8px}
#tb{right:8px;top:calc(var(--st) + 8px);display:flex;gap:6px}#tb button{font-size:18px}
#rm{left:50%;transform:translateX(-50%);top:calc(var(--st) + 8px)}
#ht{left:50%;transform:translateX(-50%);top:calc(var(--st) + 52px);max-width:80vw;text-align:center;background:#4a3322e6;color:#f6ecd2}
#sd{left:8px;bottom:calc(var(--sb) + 8px);width:250px}
.st{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}
.g3{display:flex;gap:4px;margin-top:6px;text-align:center}.g3>div{flex:1;border:1px solid #b99c6c;border-radius:4px;padding:3px}
#bt{left:270px;right:8px;bottom:calc(var(--sb) + 8px);display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;box-shadow:none;pointer-events:none}
#bt>*{pointer-events:auto}
#sbm,#br{display:flex;gap:6px;background:var(--p);border:3px solid var(--b);border-radius:6px;padding:5px;flex-wrap:wrap;justify-content:center}
#br button{font-size:24px;width:56px;height:52px}#sbm button{min-width:92px;font-size:12px}
#rs{background:var(--p);border:2px solid var(--b);border-radius:6px;padding:2px 12px;letter-spacing:2px}
#mu{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;overflow:auto;background:linear-gradient(135deg,#5fb3a5,#e9e6df 65%)}
.c{position:static;text-align:center;padding:20px 26px;max-width:560px;user-select:auto}
.c h1{margin:0;font-size:36px;color:var(--r)}.c h2{margin:0 0 10px}
.mp{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.mc{width:150px;display:flex;flex-direction:column;gap:5px;align-items:center}.mc span,.mc i{font-size:11px}
.mc canvas{border:2px solid var(--b);width:120px;height:120px;image-rendering:pixelated}
input{font:inherit;width:90px;padding:4px;border:2px solid var(--b);border-radius:6px}
@media(max-width:700px){#sd{width:175px;font-size:11px}#bt{left:192px}#tp{width:200px}}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hud" hidden>
 <div id="tp" class="pn"><b id="tt"></b><div id="dt"></div><div id="spd"><button data-s="0">⏸</button><button data-s="1">▶</button><button data-s="2">⏩</button><button data-s="4">⏭</button></div></div>
 <div id="tb" class="pn"><button id="sv" title="Lưu game">💾</button><button id="hm" title="Về menu">⌂</button></div>
 <div id="rm" class="pn" hidden></div><div id="ht" class="pn" hidden></div>
 <div id="sd" class="pn"><div class="st"><span>😊 <b id="hp"></b></span><span>❤ <b id="hl"></b></span><span>🏘 <b id="fr"></b></span><span>👷 <b id="idl"></b></span></div>
  <div>Cư dân <b id="pp"></b> · Chỗ ở <b id="cp"></b></div>
  <div class="g3"><div>Tài chính<br>💰 <b id="mo"></b></div><div>Thức ăn<br>🍚 <b id="fo"></b></div><div>Vật tư<br>📦 <b id="vt"></b></div></div></div>
 <div id="bt" class="pn"><div id="sbm" hidden></div><div id="br"></div><div id="rs"></div></div>
</div>
<div id="mu"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],set=(i,v)=>{$('#'+i).textContent=v};
const W=48,OX=W*32,OY=40,cv=$('#cv'),cx=cv.getContext('2d');
const H=(i,j,s)=>{const n=Math.sin(i*127.1+j*311.7+s*74.7)*43758.5453;return n-Math.floor(n)},sm=u=>u*u*(3-2*u);
const N=(x,y,s)=>{const i=Math.floor(x),j=Math.floor(y),u=sm(x-i),v=sm(y-j);return H(i,j,s)*(1-u)*(1-v)+H(i+1,j,s)*u*(1-v)+H(i,j+1,s)*(1-u)*v+H(i+1,j+1,s)*u*v};
const nz=(x,y,s)=>N(x/7,y/7,s)*.65+N(x/3.5,y/3.5,s+9)*.35;
const MAPS={
 gn:{n:'Giang Nam',s:1,d:'Hai vịnh xanh biếc, đất liền chạy chéo như trong ảnh mẫu.',w:(x,y,n)=>Math.max(1-Math.hypot(x-6,y-8)/17,1-Math.hypot(x-43,y-41)/15)+(n-.5)*.7>.2},
 hk:{n:'Hải Khẩu',s:2,d:'Biển lớn ở phía đông, vịnh nhỏ phía nam.',w:(x,y,n)=>x+(n-.5)*16>35||Math.hypot(x-12,y-47)<9+(n-.5)*8},
 ht:{n:'Hồ Sơn Thủy',s:3,d:'Hồ rộng bên trái, sông cắt ngang phía nam.',w:(x,y,n)=>Math.hypot(x-14,y-20)<10+(n-.5)*10||Math.abs(y-(41+3*Math.sin(x/5)))<1.6+(n-.5)*2.5}};
const CAT=[['🛣','Đường'],['🏠','Nhà ở'],['🌾','Nông nghiệp'],['⚒','Sản xuất'],['🏯','Dịch vụ']],RN={w:'🪵',s:'🪨',b:'🧱'};
const TT=[[0,'Trấn nhỏ — khởi đầu'],[50,'Khởi Sơn Trại'],[100,'Bình An Thôn'],[300,'Tụ Thương Thị'],[500,'Sầm Uất Trấn'],[1000,'Thịnh Vượng Huyện'],[2000,'Trầm Cổ Phủ'],[5000,'Vạn Dân Châu']];
const BD={
 hall:{n:'Trấn Sở',w:3,h:3,z:38,c:'#b0382a',cap:10},
 road:{n:'Đường đất',g:0,w:1,h:1,z:0,c:'#cdb88e',$:{w:1}},
 house1:{n:'Nhà gỗ',g:1,w:1,h:1,z:22,c:'#a8794a',$:{w:10},cap:4},
 house3:{n:'Nhà ngói',g:1,w:2,h:2,z:30,c:'#5b7690',$:{w:20,s:5,b:8},cap:10},
 court:{n:'Nhà sân trong',g:1,w:2,h:2,z:34,c:'#5f8a78',$:{w:30,s:12,b:12},cap:14},
 field:{n:'Ruộng lúa',g:2,w:2,h:2,z:2,c:'#d8d6b0',$:{},jobs:2,out:'f',v:26},
 lumber:{n:'Nhà đốn gỗ',g:3,w:2,h:2,z:26,c:'#8a6a3a',$:{w:15,s:6},jobs:3,out:'w',v:16},
 quarry:{n:'Mỏ đá',g:3,w:2,h:2,z:16,c:'#9a9a9a',$:{w:15,s:12},jobs:4,out:'s',v:10},
 kiln:{n:'Lò gạch',g:3,w:2,h:2,z:28,c:'#b5533c',$:{w:15,s:8},jobs:3,out:'b',v:7},
 well:{n:'Giếng',g:4,w:1,h:1,z:10,c:'#7f9aa8',$:{w:8,s:8},jobs:1},
 market:{n:'Chợ',g:4,w:3,h:3,z:26,c:'#d9a441',$:{w:20,s:12,b:8},jobs:4,out:'m',v:40},
 tea:{n:'Trà quán',g:4,w:2,h:2,z:34,c:'#9a6b4b',$:{w:20,s:8},jobs:3,out:'m',v:15}};
let G={},Z=.8,CX=0,CY=0,tool=null,cat=-1,ms={x:0,y:0},keys={};
const P=(x,y)=>[(x-y)*32+OX,(x+y)*16+OY],iw=(x,y)=>x<0||y<0||x>=W||y>=W||G.wt[y*W+x];
const sh=(h,k)=>'#'+[1,3,5].map(i=>Math.min(255,Math.round(parseInt(h.substr(i,2),16)*k)).toString(16).padStart(2,'0')).join('');
function poly(c,p,f,s){c.beginPath();p.forEach((q,i)=>c[i?'lineTo':'moveTo'](q[0],q[1]));c.closePath();if(f){c.fillStyle=f;c.fill()}if(s){c.strokeStyle=s;c.stroke()}}
/* ===== bản đồ ===== */
function gen(){const m=MAPS[G.map];G.wt=new Uint8Array(W*W);G.occ=new Uint8Array(W*W);G.tr=new Uint8Array(W*W);
 for(let y=0;y<W;y++)for(let x=0;x<W;x++){const i=y*W+x;G.wt[i]=m.w(x,y,nz(x,y,m.s))?1:0;G.tr[i]=!G.wt[i]&&nz(x,y,m.s+5)>.58&&H(x,y,m.s)>.3?1:0}
 const t=G.terr=document.createElement('canvas');t.width=W*64;t.height=W*32+90;const c=t.getContext('2d');
 for(let s=0;s<2*W-1;s++)for(let x=Math.max(0,s-W+1);x<=Math.min(s,W-1);x++){const y=s-x;if(G.wt[y*W+x])continue;
  const A=P(x,y),B=P(x+1,y),C=P(x+1,y+1),D=P(x,y+1);
  if(iw(x,y+1))poly(c,[D,C,[C[0],C[1]+10],[D[0],D[1]+10]],'#9b7a55');
  if(iw(x+1,y))poly(c,[C,B,[B[0],B[1]+10],[C[0],C[1]+10]],'#7d6044');
  poly(c,[A,B,C,D],(x+y)%2?'#ebe8dd':'#e6e2d5','rgba(120,110,90,.1)')}}
function prev(k){const c=$('#p'+k).getContext('2d'),M=MAPS[k];for(let y=0;y<W;y++)for(let x=0;x<W;x++){c.fillStyle=M.w(x,y,nz(x,y,M.s))?'#5fb3a5':'#ebe8dd';c.fillRect(x*2,y*2,2,2)}}
/* ===== vẽ ===== */
function db(c,t,x,y,a){const D=BD[t],{w,h,z}=D,A=P(x,y),B=P(x+w,y),C=P(x+w,y+h),L=P(x,y+h),u=(p,k)=>[p[0],p[1]-k];c.globalAlpha=a;
 if(z<5){poly(c,[A,B,C,L],D.c);if(t=='field')for(let k=1;k<4;k++){const p=P(x+k*w/4,y),q=P(x+k*w/4,y+h);c.beginPath();c.moveTo(p[0],p[1]);c.lineTo(q[0],q[1]);c.strokeStyle='#a39a6a';c.stroke()}}
 else{poly(c,[L,C,u(C,z),u(L,z)],'#ddd1b4','#0002');poly(c,[C,B,u(B,z),u(C,z)],'#bcab88','#0002');
  const m=P(x+w/2,y+h/2),pk=[m[0],m[1]-z-z*.5],ua=u(A,z),ub=u(B,z),uc=u(C,z),ul=u(L,z);
  poly(c,[ua,ub,pk],sh(D.c,1.1));poly(c,[ul,ua,pk],D.c);poly(c,[ul,uc,pk],sh(D.c,.88),'#0003');poly(c,[uc,ub,pk],sh(D.c,.68),'#0003')}
 c.globalAlpha=1}
function tree(c,x,y){const p=P(x+.5,y+.5);c.fillStyle='#6b4b2f';c.fillRect(p[0]-2,p[1]-12,4,12);c.fillStyle=(x+y)%3?'#5b8a5e':'#4a7a52';c.beginPath();c.arc(p[0],p[1]-20,10,0,7);c.fill();c.fillStyle='#f4f2ea';c.beginPath();c.arc(p[0]-2,p[1]-25,5,0,7);c.fill()}
function anchor(t){const D=BD[t],u=((ms.x-CX)/Z-OX)/32,q=((ms.y-CY)/Z-OY)/16,x=(u+q)/2,y=(q-u)/2;return[Math.round(x-D.w/2),Math.round(y-D.h/2),x,y]}
function draw(){const c=cx,L=[];c.setTransform(1,0,0,1,0,0);c.fillStyle='#5fb3a5';c.fillRect(0,0,cv.width,cv.height);c.setTransform(Z,0,0,Z,CX,CY);c.drawImage(G.terr,0,0);
 for(let i=0;i<W*W;i++)if(G.tr[i]){const x=i%W,y=i/W|0;L.push([x+y,0,x,y])}
 for(const o of G.o){const D=BD[o.t];L.push([o.x+o.y+D.w+D.h-2,1,o])}
 L.sort((a,b)=>a[0]-b[0]);for(const e of L)e[1]?db(c,e[2].t,e[2].x,e[2].y,e[2].p>=6?1:.5):tree(c,e[2],e[3]);
 if(tool&&!G.pan){const[x,y]=anchor(tool),D=BD[tool],ok=can(tool,x,y);poly(c,[P(x,y),P(x+D.w,y),P(x+D.w,y+D.h),P(x,y+D.h)],ok?'#3caa5a99':'#c8322899');db(c,tool,x,y,.7)}
 c.setTransform(1,0,0,1,0,0);c.font='12px sans-serif';
 for(const p of G.peers||[]){const r=p.presence;if(p.isMe||!r||typeof r.x!='number'||typeof r.y!='number')continue;const q=P(r.x,r.y),sx=CX+Z*q[0],sy=CY+Z*q[1],col=/^#[0-9a-f]{6}$/i.test(r.c)?r.c:'#c0392b';
  c.fillStyle=col;c.beginPath();c.moveTo(sx,sy);c.lineTo(sx+4,sy+17);c.lineTo(sx+9,sy+11);c.lineTo(sx+16,sy+14);c.closePath();c.fill();c.strokeStyle='#fff';c.stroke();
  c.fillText(String(r.n||'Người chơi').slice(0,16),sx+16,sy+28)}}
/* ===== luật chơi ===== */
function can(t,x,y){const D=BD[t];if(t=='hall'?G.hall:!G.hall)return 0;
 for(let j=0;j<D.h;j++)for(let i=0;i<D.w;i++)if(iw(x+i,y+j)||G.occ[(y+j)*W+x+i])return 0;
 for(const k in D.$||{})if((G.r[k]||0)<D.$[k])return 0;return 1}
function put(t,x,y){const D=BD[t];for(const k in D.$||{})G.r[k]-=D.$[k];G.o.push({t,x,y,p:t=='hall'?6:0});
 for(let j=0;j<D.h;j++)for(let i=0;i<D.w;i++){const k=(y+j)*W+x+i;G.occ[k]=1;G.tr[k]=0}if(t=='hall'){G.hall=1;G.pop=10}}
function stat(){let cap=0,jobs=0;for(const o of G.o)if(o.p>=6){const D=BD[o.t];cap+=D.cap||0;jobs+=D.jobs||0}return{cap,jobs,idle:Math.max(0,Math.round(G.pop*.6-jobs))}}
function month(){const S=stat(),R=G.r,ra=S.jobs?Math.min(1,G.pop*.6/S.jobs):0;let wl=0;
 for(const o of G.o){if(o.p<6)continue;const D=BD[o.t];if(o.t=='well'||o.t=='tea')wl++;if(D.out){if(D.out=='b'){if(R.w<6)continue;R.w-=6}R[D.out]+=Math.round(D.v*ra)}}
 R.f-=G.pop;R.m+=G.pop;
 if(R.f<0){R.f=0;G.pop=Math.max(2,G.pop-Math.ceil(G.pop*.1));G.hp-=10}
 else if(G.pop<S.cap&&R.f>G.pop*2)G.pop=Math.min(S.cap,5000,G.pop+Math.max(1,Math.ceil(G.pop*.08)));
 G.hp=Math.max(0,Math.min(99,G.hp+(R.f>G.pop*3?3:-1)+wl-(S.idle>G.pop*.3?4:0)));G.hl=Math.min(99,80+wl*3)}
function tick(){G.day++;for(const o of G.o)if(o.p<6)o.p++;if(G.day%30==0)month();if(G.day%360==0)saveG(1)}
/* ===== lưu / tải / mạng ===== */
const snap=()=>({m:G.map,d:G.day,r:G.r,p:G.pop,h:G.hall,sp:G.sp,hp:G.hp,hl:G.hl,o:G.o.map(o=>[o.t,o.x,o.y,o.p]),tr:[...G.tr].join('')});
function load(s){G.day=s.d|0;G.r=s.r;G.pop=s.p|0;G.hall=s.h?1:0;G.hp=s.hp;G.hl=s.hl;if(!G.host)G.sp=s.sp|0;G.o=[];G.occ.fill(0);
 s.o.forEach(a=>{const D=BD[a[0]];if(!D)return;G.o.push({t:a[0],x:a[1],y:a[2],p:a[3]});for(let j=0;j<D.h;j++)for(let i=0;i<D.w;i++)G.occ[(a[2]+j)*W+a[1]+i]=1});
 if(s.tr&&s.tr.length==W*W)G.tr=Uint8Array.from(s.tr,Number)}
const getSave=(s,k)=>{try{const d=JSON.parse(localStorage.getItem('dt-'+s+'-'+k));return d&&Array.isArray(d.o)&&d.r&&d.tr&&d.tr.length==W*W?d:null}catch(e){return null}};
function note(s){G.nt=s;G.nu=Date.now()+2200}
function saveG(q){if(!G.hall||!G.host)return;try{localStorage.setItem('dt-'+G.mode+'-'+G.map,JSON.stringify(snap()));q||note('Đã lưu game')}catch(e){note('Không lưu được: '+e.message)}}
const send=()=>G.room&&G.room.emit('snap',snap()).catch(()=>{});
function leave(){clearInterval(G.t1);try{G.room&&G.room.leave&&G.room.leave()}catch(e){}G.room=0}
async function net(code,host){const R=window.claude&&await claude.use('room');
 if(!R){alert('Chế độ nhiều người chỉ chạy khi mở game từ liên kết claude.ai.');return 0}
 const r=G.room=await R.join('dt-'+code);G.code=code;G.host=host;G.name=(host?'Chủ phòng ':'Khách ')+(10+Math.floor(Math.random()*90));
 r.on('req',m=>{if(!G.host||m.isMe)return;const d=m.data||{},x=d.x|0,y=d.y|0;if(BD[d.t]&&can(d.t,x,y)){put(d.t,x,y);send()}});
 r.on('snap',m=>{if(G.host||m.isMe)return;const s=m.data;if(!s||!MAPS[s.m])return;if(!G.got){G.got=1;G.map=s.m;gen();load(s);start()}else load(s)});
 r.onPeers(c=>{G.peers=c.peers;if(G.host&&c.joined.length)send();if(!G.host&&c.peers.length>2&&!G.full){G.full=1;leave();alert('Phòng đã đủ 2 người.');showMenu(2)}});
 G.t1=setInterval(()=>G.host&&send(),1000);return 1}
function pres(){if(!G.room||Date.now()-(G.lp||0)<70)return;G.lp=Date.now();const a=anchor('road');G.room.presence({x:a[2],y:a[3],n:G.name,c:G.host?'#c0392b':'#2b6fc0'}).catch(()=>{})}
/* ===== menu ===== */
function showMenu(s){leave();G.on=0;$('#hud').hidden=1;const m=$('#mu');m.hidden=0;
 if(!s){m.innerHTML='<div class="pn c"><h1>Đại Thành</h1><p>Thịnh Thế Hoa Hạ</p><button onclick="showMenu(1)">Một người</button> <button onclick="showMenu(2)">Nhiều người (2)</button><p style="font-size:11px">Bản lưu nằm trong trình duyệt này.</p></div>';return}
 m.innerHTML='<div class="pn c"><h2>'+(s==1?'Một người — chọn bản đồ':'Nhiều người — chọn bản đồ')+'</h2><div class="mp">'+Object.keys(MAPS).map(k=>{const M=MAPS[k],d=getSave(s,k);
  return `<div class="mc"><canvas id="p${k}" width="96" height="96"></canvas><b>${M.n}</b><span>${M.d}</span>`+(d?`<i>Đã lưu: Năm ${Math.floor(d.d/360)+1}, ${d.p} dân</i><button onclick="go(${s},'${k}',1)">Chơi tiếp</button><button onclick="go(${s},'${k}',0)">Chơi mới</button>`:`<button onclick="go(${s},'${k}',0)">${s==1?'Chơi':'Tạo phòng'}</button>`)+'</div>'}).join('')+'</div>'
  +(s==2?'<p>Hoặc vào phòng bạn bè: <input id="jc" maxlength="8" placeholder="mã phòng"> <button onclick="join()">Vào phòng</button></p>':'')+'<button onclick="showMenu()">← Quay lại</button></div>';
 for(const k in MAPS)prev(k)}
const fresh=(s,k)=>({mode:s,map:k,host:1,r:{w:300,s:150,b:40,f:400,m:600},pop:0,day:0,sp:1,hall:0,o:[],hp:70,hl:95,peers:[]});
async function go(s,k,cont){G=fresh(s,k);gen();if(cont){const d=getSave(s,k);if(d)load(d)}
 if(s==2&&!await net(Math.random().toString(36).slice(2,6),1))return showMenu(2);start()}
async function join(){const code=($('#jc').value||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');if(!code)return;
 G=fresh(2,'gn');G.host=0;G.sp=0;G.wt=new Uint8Array(W*W);G.occ=new Uint8Array(W*W);G.tr=new Uint8Array(W*W);
 if(!await net(code,0))return showMenu(2);$('#mu').innerHTML='<div class="pn c">Đang vào phòng '+code+'…</div>';
 setTimeout(()=>{if(!G.got&&G.room){leave();alert('Không tìm thấy phòng '+code);showMenu(2)}},6000)}
function start(){$('#mu').hidden=1;$('#hud').hidden=0;G.on=1;CX=cv.width/2-Z*OX;CY=cv.height/2-Z*(OY+W*16);tool=G.hall?null:'hall';cat=-1;$('#sbm').hidden=1;
 $('#br').innerHTML=CAT.map((c,i)=>`<button data-c="${i}" title="${c[1]}">${c[0]}</button>`).join('')}
function sub(){const s=$('#sbm');s.hidden=cat<0;if(cat<0)return;s.innerHTML=Object.keys(BD).filter(k=>BD[k].g===cat).map(k=>{const D=BD[k],c=Object.entries(D.$||{}).map(([a,v])=>RN[a]+v).join(' ')||'Miễn phí';return`<button data-k="${k}" class="${tool==k?'on':''}"><b>${D.n}</b><br>${c}</button>`}).join('')}
/* ===== giao diện ===== */
$('#br').onclick=e=>{const b=e.target.closest('button');if(!b||!G.hall)return;cat=cat==+b.dataset.c?-1:+b.dataset.c;if(cat<0)tool=null;sub()};
$('#sbm').onclick=e=>{const b=e.target.closest('button');if(b){tool=b.dataset.k;sub()}};
$('#spd').onclick=e=>{const b=e.target.closest('button');if(b&&G.host&&G.hall)G.sp=+b.dataset.s};
$('#sv').onclick=()=>G.host?saveG():note('Chỉ chủ phòng lưu game');
$('#hm').onclick=()=>{saveG(1);showMenu()};
function clk(){const t=tool;if(!t||!G.on)return;const[x,y]=anchor(t);if(!can(t,x,y))return;
 if(G.host){put(t,x,y);send()}else G.room&&G.room.emit('req',{t,x,y}).catch(()=>{});if(t=='hall')tool=null}
cv.onpointerdown=e=>{ms.x=e.clientX;ms.y=e.clientY;if(e.button==0&&!(e.pointerType=='touch'&&!tool)){G.dn=1;clk()}else G.pan={x:e.clientX,y:e.clientY,m:0}};
cv.onpointermove=e=>{ms.x=e.clientX;ms.y=e.clientY;const p=G.pan;if(p){CX+=e.clientX-p.x;CY+=e.clientY-p.y;p.m+=Math.abs(e.clientX-p.x)+Math.abs(e.clientY-p.y);p.x=e.clientX;p.y=e.clientY}else if(G.dn&&tool&&tool!='hall')clk();if(G.on)pres()};
cv.onpointerup=cv.onpointerleave=()=>{if(G.pan&&G.pan.m<5&&G.hall){tool=null;sub()}G.pan=0;G.dn=0};
cv.oncontextmenu=e=>e.preventDefault();
cv.onwheel=e=>{const q=Math.min(1.6,Math.max(.35,Z*(e.deltaY<0?1.1:.9))),f=q/Z;CX=e.clientX-(e.clientX-CX)*f;CY=e.clientY-(e.clientY-CY)*f;Z=q};
onkeydown=e=>{const k=e.key.toLowerCase();keys[k]=1;if(k=='escape'&&G.hall){tool=null;sub()}if(k==' '&&G.host&&G.hall){G.sp=G.sp?0:1;e.preventDefault()}};onkeyup=e=>keys[e.key.toLowerCase()]=0;
onresize=()=>{cv.width=innerWidth;cv.height=innerHeight};onresize();
function hud(){if(!G.on)return;const S=stat(),R=G.r,m=Math.floor(G.day/30)%12+1,y=Math.floor(G.day/360)+1;let t='';for(const a of TT)if(G.pop>=a[0])t=a[1];
 set('tt','【'+t+'】');set('dt','Tháng '+m+' Năm thứ '+y);set('hp',G.hp);set('hl',G.hl);set('fr',Math.max(0,S.cap-G.pop));set('idl',S.idle);set('pp',G.pop);set('cp',S.cap);
 set('mo',R.m);set('fo',R.f);set('vt',R.w+R.s+R.b);set('rs','🪵 '+R.w+'  🪨 '+R.s+'  🧱 '+R.b);
 $$('#spd button').forEach(b=>b.classList.toggle('on',+b.dataset.s==G.sp));$('#br').style.opacity=G.hall?1:.4;
 if(G.hall&&tool=='hall')tool=null;if(!G.hall&&!tool)tool='hall';
 const rm=$('#rm');rm.hidden=!G.room;if(G.room)rm.textContent='Phòng '+G.code+' · 👥 '+G.peers.length+'/2';
 const h=Date.now()<G.nu?G.nt:!G.hall?'Chọn nơi lập trấn: chuột trái đặt Trấn Sở (3×3) lên đất liền · chuột phải kéo = di chuyển · lăn chuột = thu phóng':tool?'Đang xây: '+BD[tool].n+' · chuột trái đặt · chuột phải/Esc hủy':'';
 const ht=$('#ht');ht.hidden=!h;ht.textContent=h}
setInterval(hud,200);
let last=0;function loop(t){const dt=Math.min(.1,(t-last)/1000);last=t;
 if(G.on){const v=500*dt;if(keys.a||keys.arrowleft)CX+=v;if(keys.d||keys.arrowright)CX-=v;if(keys.w||keys.arrowup)CY+=v;if(keys.s||keys.arrowdown)CY-=v;
  if(G.hall&&G.host&&G.sp){G.acc=(G.acc||0)+dt*G.sp;while(G.acc>.3){G.acc-=.3;tick()}}draw()}
 requestAnimationFrame(loop)}
showMenu();requestAnimationFrame(loop);
</script></body></html>
