<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đại Thành — Thịnh Thế Hoa Hạ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- MENU CHÍNH -->
  <div id="menu">
    <h1>Đại Thành</h1>
    <p class="sub">Thịnh Thế Hoa Hạ</p>
    <div id="menu-buttons"></div>
  </div>

  <!-- MÀN HÌNH GAME -->
  <canvas id="game" hidden></canvas>
  <div id="hud" hidden>
    <button id="btn-back">Về menu</button>
    <span id="coord">Ô: -, -</span>
  </div>

  <!-- THỨ TỰ NẠP FILE QUAN TRỌNG: file nào dùng file khác thì phải nằm sau -->
  <script src="js/core/config.js"></script>
  <script src="js/core/iso.js"></script>
  <script src="js/core/camera.js"></script>
  <script src="js/world/map.js"></script>
  <script src="js/world/registry.js"></script>

  <!-- Mỗi loại vật thể một file riêng -->
  <script src="js/world/objects/tree.js"></script>
  <script src="js/world/objects/house.js"></script>

  <!-- Danh sách vị trí đặt vật thể -->
  <script src="js/data/placements.js"></script>

  <script src="js/world/world.js"></script>
  <script src="js/core/renderer.js"></script>
  <script src="js/network/multiplayer.js"></script>
  <script src="js/ui/menu.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
